version = 1
SPDX-PackageName = "fin-dee"
SPDX-PackageSupplier = "Zachary Heskett <zheskett@gmail.com>"
SPDX-PackageDownloadLocation = "https://github.com/zheskett/fin-dee"

[[annotations]]
path = [
  ".env.sample",
  ".gitattributes",
  ".gitignore",
  "Dockerfile",
  "README.md",
  "build.gradle.kts",
  "settings.gradle.kts",
  "dev.sh",
  "gradle.properties",
  "gradle/libs.versions.toml",
  "src/main/resources/application.yaml",
  "src/main/resources/logback.xml",
  "src/main/resources/static/favicon.png",
  "src/main/resources/static/logo.svg",
  "src/main/resources/static/styles.css",
]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Zachary Heskett <zheskett@gmail.com>"
SPDX-License-Identifier = "GPL-3.0-or-later"

[[annotations]]
path = [
  "gradle/wrapper/gradle-wrapper.jar",
  "gradle/wrapper/gradle-wrapper.properties",
]
precedence = "aggregate"
SPDX-FileCopyrightText = "Gradle, Inc."
SPDX-License-Identifier = "Apache-2.0"

[[annotations]]
path = "src/main/resources/static/Sortable.min.js"
precedence = "aggregate"
SPDX-FileCopyrightText = "2019 All contributors to SortableJS"
SPDX-License-Identifier = "MIT"

[[annotations]]
path = "src/main/resources/static/bulma.min.css"
precedence = "aggregate"
SPDX-FileCopyrightText = "Jeremy Thomas"
SPDX-License-Identifier = "MIT"

[[annotations]]
path = "src/main/resources/static/htmx.min.js"
precedence = "aggregate"
SPDX-FileCopyrightText = "Big Sky Software LLC"
SPDX-License-Identifier = "0BSD"

[[annotations]]
path = "src/main/resources/static/fontawesome/css/all.min.css"
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Fonticons, Inc."
SPDX-License-Identifier = "MIT"

[[annotations]]
path = "src/main/resources/static/fontawesome/webfonts/**"
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Fonticons, Inc."
SPDX-License-Identifier = "OFL-1.1"

[[annotations]]
path = "src/main/resources/static/Fredoka-Bold.woff2"
precedence = "aggregate"
SPDX-FileCopyrightText = "2016 The Fredoka Project Authors (https://github.com/hafontia/Fredoka-One)"
SPDX-License-Identifier = "OFL-1.1"
